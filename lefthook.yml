pre-commit:
  parallel: true
  commands:
    shellcheck:
      glob: "*.sh"
      run: scripts/hooks/check-staged-shell.sh --execute {staged_files}
    yamllint:
      glob: "*.{yaml,yml}"
      run: scripts/hooks/check-staged-yaml.sh --execute {staged_files}

pre-push:
  commands:
    local-ci:
      run: uv run --locked scripts/hooks/run-local-ci.sh --execute
    installer-privacy:
      run: uv run --locked make test-security
    gate-refusal-contract:
      run: bats tests/local-gate-refusal.bats
